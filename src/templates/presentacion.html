<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VíaSegura IA · Grupo 3 · Siniestralidad vial en Bogotá</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="/static/presentacion/01.webp">
<style>
  :root {
    --morado: #4a1560; --morado-osc: #2a0b38; --magenta: #d4136f; --fondo: #1c0826;
    --tinta: #f7f2fa; --suave: rgba(247, 242, 250, .62);
    --salida: cubic-bezier(.7, 0, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo);
               font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }

  /* ── dos capas a pantalla completa: presentación y app ── */
  .capa { position: fixed; inset: 0; z-index: 1; }
  .capa.oculta { visibility: hidden; }
  .capa.arriba { z-index: 2; }

  /* ── presentación ── */
  #capa-pres { background: radial-gradient(120% 90% at 50% 40%, #2b0d3a 0%, var(--fondo) 70%);
               display: grid; grid-template-rows: 1fr auto; }
  .escenario { position: relative; display: grid; place-items: center; padding: 76px 3vw 12px; min-height: 0; }
  .marco { position: relative; aspect-ratio: 16 / 9;
           width: min(100%, calc((100vh - 76px - 12px - 92px) * 16 / 9));
           border-radius: 10px; overflow: hidden; background: #f9f7fb;
           box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .06); }
  .diapo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
           opacity: 0; transform: translateX(var(--desde, 0)); pointer-events: none;
           transition: opacity .38s ease, transform .5s var(--salida); }
  .diapo.activa { opacity: 1; transform: none; }

  .controles { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 10px 0 26px; }
  .flecha { width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .18);
            background: rgba(255, 255, 255, .06); color: var(--tinta); cursor: pointer;
            display: grid; place-items: center; transition: background .2s, transform .2s, opacity .2s; }
  .flecha:hover:not(:disabled) { background: var(--magenta); border-color: var(--magenta); transform: scale(1.06); }
  .flecha:disabled { opacity: .28; cursor: default; }
  .flecha svg { width: 22px; height: 22px; }
  .contador { min-width: 92px; text-align: center; color: var(--suave); font-size: 15px;
              font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .contador b { color: var(--tinta); font-weight: 600; }
  .progreso { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
  .progreso i { display: block; height: 100%; width: 0; background: var(--magenta); transition: width .5s var(--salida); }

  /* ── app (mapa, modelos e IA) ── */
  #capa-app { background: #f6f7f9; }
  #capa-app iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cargando { position: absolute; inset: 0; display: grid; place-items: center; color: #5f6b7a; font-size: 15px; }

  /* ── botones que expanden la otra vista ── */
  .boton-vista { position: absolute; top: 16px; z-index: 5; display: inline-flex; align-items: center; gap: 10px;
                 height: 46px; padding: 0 18px 0 8px; border: 0; border-radius: 999px; cursor: pointer;
                 font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1; letter-spacing: .01em; color: #fff;
                 background: var(--magenta); box-shadow: 0 10px 28px -8px rgba(212, 19, 111, .7);
                 transition: transform .2s, box-shadow .2s, background .2s; }
  .boton-vista:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 14px 34px -8px rgba(212, 19, 111, .85); }
  .boton-vista:focus-visible, .flecha:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .boton-vista .icono { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .2);
                        display: grid; place-items: center; }
  .boton-vista svg { width: 18px; height: 18px; }
  #ir-app { left: 16px; }
  #ir-pres { right: 16px; background: var(--morado); box-shadow: 0 10px 28px -8px rgba(42, 11, 56, .7); }
  #ir-pres:hover { background: var(--morado-osc); }
  #ir-app .icono { animation: latido 2.6s ease-in-out infinite; }
  @keyframes latido { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .45); } 50% { box-shadow: 0 0 0 7px rgba(255, 255, 255, 0); } }

  @media (max-width: 640px) {
    .boton-vista { padding: 0 7px; } .boton-vista .texto { display: none; }
    .escenario { padding: 72px 10px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .diapo, .progreso i { transition: opacity .2s; transform: none !important; }
    #ir-app .icono { animation: none; }
  }
</style>
</head>
<body>

<!-- Presentación: lo primero que se ve -->
<section id="capa-pres" class="capa arriba" aria-label="Presentación">
  <button id="ir-app" class="boton-vista" type="button" aria-label="Ver los modelos y la IA">
    <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span>
    <span class="texto">Modelos e IA</span>
  </button>

  <div class="escenario">
    <div class="marco" id="marco">
      {% for i in range(1, n_diapositivas + 1) %}
      <img class="diapo" data-src="/static/presentacion/{{ '%02d' % i }}.webp"
           alt="Diapositiva {{ i }} de {{ n_diapositivas }}" draggable="false">
      {% endfor %}
      <div class="progreso"><i id="barra"></i></div>
    </div>
  </div>

  <nav class="controles" aria-label="Navegación de diapositivas">
    <button class="flecha" id="anterior" type="button" aria-label="Diapositiva anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="contador" aria-live="polite"><b id="actual">1</b> / {{ n_diapositivas }}</div>
    <button class="flecha" id="siguiente" type="button" aria-label="Diapositiva siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </nav>
</section>

<!-- La app de siempre (mapa, chat, normas, modelos ML), dentro de un iframe -->
<section id="capa-app" class="capa oculta" aria-label="Modelos e IA" inert>
  <div class="cargando">Cargando el mapa y los modelos…</div>
  <iframe id="marco-app" title="VíaSegura IA: mapa, chat y modelos" data-src="/app"></iframe>
  <button id="ir-pres" class="boton-vista" type="button" aria-label="Volver a la presentación">
    <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg></span>
    <span class="texto">Presentación</span>
  </button>
</section>

<script>
(() => {
  const diapos = [...document.querySelectorAll(".diapo")];
  const N = diapos.length;
  const $ = id => document.getElementById(id);
  const capas = { pres: $("capa-pres"), app: $("capa-app") };
  const iframe = $("marco-app");
  let i = 0, vista = "pres", animando = false;

  // ── diapositivas ──
  function cargar(k) {
    const im = diapos[k];
    if (im && !im.src) im.src = im.dataset.src;
  }
  function ir(k, dir = 0) {
    if (k < 0 || k >= N) return;
    const previa = diapos[i];
    i = k;
    [i - 1, i, i + 1, i + 2].forEach(cargar);          // la actual y las vecinas, sin bajar las 20 de una vez
    diapos.forEach(d => d.style.setProperty("--desde", "0"));
    diapos[i].style.setProperty("--desde", dir > 0 ? "28px" : dir < 0 ? "-28px" : "0");
    if (previa !== diapos[i]) previa.classList.remove("activa");
    requestAnimationFrame(() => diapos[i].classList.add("activa"));
    $("actual").textContent = i + 1;
    $("anterior").disabled = i === 0;
    $("siguiente").disabled = i === N - 1;
    $("barra").style.width = `${(100 * (i + 1)) / N}%`;
    history.replaceState(null, "", i ? `#${i + 1}` : location.pathname);
  }
  $("anterior").onclick = () => ir(i - 1, -1);
  $("siguiente").onclick = () => ir(i + 1, 1);

  document.addEventListener("keydown", e => {
    if (vista !== "pres" || animando || e.altKey || e.ctrlKey || e.metaKey) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); ir(i + 1, 1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); ir(i - 1, -1); }
    else if (e.key === "Home") ir(0, -1);
    else if (e.key === "End") ir(N - 1, 1);
  });

  // deslizar con el dedo en celulares y tabletas
  let x0 = null;
  $("marco").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  $("marco").addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) dx < 0 ? ir(i + 1, 1) : ir(i - 1, -1);
    x0 = null;
  });

  // ── la app se precarga en segundo plano para que abra al instante ──
  function cargarApp() { if (!iframe.src) iframe.src = iframe.dataset.src; }
  iframe.addEventListener("load", () => document.querySelector(".cargando").remove(), { once: true });

  // ── cambio de vista: la nueva se expande en círculo desde el botón pulsado ──
  function cambiar(destino, boton) {
    if (animando || destino === vista) return;
    const entra = capas[destino], sale = capas[vista];
    const r = boton.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const radio = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
    if (destino === "app") cargarApp();

    animando = true;
    entra.classList.remove("oculta");
    entra.removeAttribute("inert");
    sale.classList.remove("arriba");
    entra.classList.add("arriba");

    const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const anim = reducir
      ? entra.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 })
      : entra.animate([
          { clipPath: `circle(${r.width / 2}px at ${cx}px ${cy}px)` },
          { clipPath: `circle(${radio}px at ${cx}px ${cy}px)` }
        ], { duration: 720, easing: "cubic-bezier(.7, 0, .2, 1)" });

    anim.onfinish = () => {
      sale.classList.add("oculta");
      sale.setAttribute("inert", "");
      vista = destino;
      animando = false;
      (destino === "app" ? $("ir-pres") : $("ir-app")).focus({ preventScroll: true });
      if (destino === "app") history.replaceState(null, "", "#app");
      else ir(i);
    };
  }
  $("ir-app").onclick = e => cambiar("app", e.currentTarget);
  $("ir-pres").onclick = e => cambiar("pres", e.currentTarget);

  // ── inicio: diapositiva del enlace (#5) o directo a la app (#app) ──
  const h = location.hash.slice(1);
  if (h === "app") {
    cargarApp();
    capas.app.classList.remove("oculta"); capas.app.removeAttribute("inert"); capas.app.classList.add("arriba");
    capas.pres.classList.remove("arriba"); capas.pres.classList.add("oculta"); capas.pres.setAttribute("inert", "");
    vista = "app";
    ir(0);
    history.replaceState(null, "", "#app");
  } else {
    ir(Math.min(Math.max((parseInt(h, 10) || 1) - 1, 0), N - 1));
    setTimeout(cargarApp, 1500);
  }
})();
</script>
</body>
</html>
